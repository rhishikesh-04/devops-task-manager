name: Mobile CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android Release APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      - name: Find and Verify Android APK
        id: apk
        run: |
          echo "Searching for generated APK files..."

          find android/app/build/outputs -type f -name "*.apk" -print

          APK=$(find android/app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK was generated."
            echo "Available build outputs:"
            find android/app/build/outputs -type f -print
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "Checking APK contents..."
          unzip -l "$APK" | head -40

      - name: Check JavaScript Bundle
        run: |
          if unzip -l "$APK_PATH" | grep -q 'index.android.bundle'; then
            echo "SUCCESS: JavaScript bundle found."
          else
            echo "ERROR: JavaScript bundle not found."
            echo "Inspect React Native Gradle configuration."
            exit 1
          fi

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    name: iOS Simulator Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS Simulator App
        run: |
          cd ios
          xcodebuild \
            -workspace DevOpsTaskManager.xcworkspace \
            -scheme DevOpsTaskManager \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build
